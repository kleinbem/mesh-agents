name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
        with:
          # Read-only Attic over NetBird; skipped when the secrets are
          # absent (fork PRs, Dependabot).
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}
      # The public cache users substitute from. Reads always; pushes what this
      # job builds on main. Skipped until the token exists (nix/infra).
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          name: mesh-agents
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      - name: Checks
        run: nix flake check
      - name: Formatting
        run: nix fmt -- --fail-on-change
      # Only main's latest build stays: each package is pinned with one
      # revision kept, and the cache's short retention collects the rest.
      # Without the CUDA/ROCm variants: they'd fill the cache's storage, and
      # GPU users build them once locally.
      - name: Build and pin the packages for the cache
        if: github.event_name == 'push' && env.CACHIX_AUTH_TOKEN != ''
        run: |
          nix eval --json .#packages.x86_64-linux --apply builtins.attrNames \
            | jq -r '.[] | select(test("-(cuda|rocm)$") | not) | select(. != "default")' \
            | while read -r name; do
                out=$(nix build --no-link --print-out-paths ".#$name")
                cachix push mesh-agents "$out"
                cachix pin mesh-agents "$name" "$out" --keep-revisions 1
              done
