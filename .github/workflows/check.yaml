name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
      - name: Checks
        run: nix flake check
      - name: Formatting
        run: nix fmt -- --fail-on-change
      # The public cache users substitute from (mesh-agents-cache.kleinbem.dev,
      # kleinbem/nix infra/mesh-agents-cache.tf): main's build replaces the
      # previous one. Skipped until the secrets exist. No CUDA/ROCm variants:
      # they'd outgrow the free tier, and GPU users build them once.
      - name: Push to the public cache
        if: github.event_name == 'push' && vars.CACHE_STORE != ''
        env:
          CACHE_STORE: ${{ vars.CACHE_STORE }}
          CACHE_SIGNING_KEY: ${{ secrets.CACHE_SIGNING_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CACHE_SECRET_ACCESS_KEY }}
        run: |
          mapfile -t pkgs < <(nix eval --json .#packages.x86_64-linux --apply builtins.attrNames |
            jq -r '.[] | select(test("-(cuda|rocm)$") or . == "default" | not) | ".#\(.)"')
          nix shell nixpkgs#awscli2 --command .github/scripts/push-cache.sh "${pkgs[@]}"
